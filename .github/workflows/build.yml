name: Build Android APK shell: bash env: ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }} run: |

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set ANDROID_SDK_ROOT
        run: echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $GITHUB_ENV

      - name: Install Android command-line tools and SDK 34
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline.zip
          unzip /tmp/cmdline.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          else
            mv $ANDROID_SDK_ROOT/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest || true
          fi
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses || true

      - name: Download offline JS libs
        run: bash OpenAppz/download-libs.sh

      - name: Make gradlew executable
        run: chmod +x ./gradlew || true

      - name: Build Android APK
        shell: bash
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show build error
        if: failure()
        shell: bash
        run: |
          msg=$(grep -A 15 -m1 "What went wrong" build.log | tr '\n' '|' || true)
          errs=$(grep -m8 -E "^e: |error:" build.log | tr '\n' '|' || true)
          echo "::error title=Gradle error::${msg} ${errs}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenAppz-debug-APK
          path: OpenAppz/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
