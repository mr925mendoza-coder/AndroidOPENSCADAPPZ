name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure a valid Gradle wrapper exists
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f ./gradlew ] || [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper is missing or incomplete; generating it now..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew
          ls -l ./gradlew ./gradle/wrapper || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Download JavaScript libraries
        shell: bash
        run: |
          set -euxo pipefail
          bash OpenAppz/download-libs.sh

      - name: Verify required Android files
        shell: bash
        run: |
          set -euxo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f OpenAppz/app/build.gradle
          test -f OpenAppz/app/src/main/AndroidManifest.xml
          test -f OpenAppz/app/src/main/java/com/mr925mendoza/openscad/MainActivity.kt
          test -f OpenAppz/app/src/main/res/values/strings.xml

      - name: Build Debug APK
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenAppz-debug-APK
          path: OpenAppz/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
