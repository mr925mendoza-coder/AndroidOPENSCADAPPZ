name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download offline JS libs
        run: bash OpenAppz/download-libs.sh

      - name: Build Android APK
        shell: bash
        run: gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show build error
        if: failure()
        shell: bash
        run: |
          msg=$(grep -A 15 -m1 "What went wrong" build.log | tr '\n' '|' || true)
          errs=$(grep -m8 -E "^e: |error:" build.log | tr '\n' '|' || true)
          echo "::error title=Gradle error::${msg} ${errs}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenAppz-debug-APK
          path: OpenAppz/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
