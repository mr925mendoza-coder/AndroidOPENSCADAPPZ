name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Gradle wrapper is executable (optional)
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ls -l ./gradlew
          else
            echo "gradlew not found in repo root — continuing with system Gradle"
          fi

      - name: Remove stale wrapper shadow dirs
        run: |
          rm -rf "CLASSPATH=$APP_HOME"
          rm -rf gardle
          rm -f OpenAppz/gradle.wrap

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Download JavaScript libraries
        run: |
          bash OpenAppz/download-libs.sh

      - name: Verify required Android files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f OpenAppz/app/build.gradle
          test -f OpenAppz/app/src/main/AndroidManifest.xml
          test -f OpenAppz/app/src/main/java/com/mr925mendoza/openscad/MainActivity.kt
          test -f OpenAppz/app/src/main/res/values/strings.xml

      - name: Build Debug APK (use wrapper if valid, otherwise system Gradle)
        run: |
          # Prefer the project Gradle wrapper when the wrapper JAR exists.
          if [ -x ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Using project Gradle wrapper"
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            echo "Gradle wrapper is missing or incomplete; using system Gradle (installed by setup-gradle)"
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenAppz-debug-APK
          path: OpenAppz/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
