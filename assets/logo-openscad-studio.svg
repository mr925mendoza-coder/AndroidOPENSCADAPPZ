<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1365" height="768" viewBox="0 0 1365 768" role="img" aria-label="OpenSCAD Studio logo">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e6e6e6"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
    <radialGradient id="ringGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c0c0c0"/>
    </radialGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="2" dy="2" result="off1"/>
      <feBlend in="SourceGraphic" in2="off1" mode="normal"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <g opacity="0.06">
    <rect x="0" y="0" width="100%" height="100%" fill="none"/>
  </g>

  <g transform="translate(682.5,384)">
    <circle r="250" fill="#2f2f2f" stroke="#111" stroke-width="8"/>
    <circle r="230" fill="url(#ringGrad)" stroke="#666" stroke-width="6"/>
    <circle r="190" fill="#0b3" stroke="#0a8" stroke-width="10"/>

    <g transform="translate(0,-10)">
      <circle r="130" fill="#efeae0" stroke="#b5aa9f" stroke-width="6"/>
      <g fill="#d3c9bf" stroke="#9a8f86" stroke-width="3">
        <path d="M-120,0 l-18,-18 l-8,-40 l36,-12 l20,6 z" transform="rotate(0)"/>
        <path d="M-120,0 l-18,-18 l-8,-40 l36,-12 l20,6 z" transform="rotate(45)"/>
        <path d="M-120,0 l-18,-18 l-8,-40 l36,-12 l20,6 z" transform="rotate(90)"/>
        <path d="M-120,0 l-18,-18 l-8,-40 l36,-12 l20,6 z" transform="rotate(135)"/>
        <path d="M-120,0 l-18,-18 l-8,-40 l36,-12 l20,6 z" transform="rotate(180)"/>
        <path d="M-120,0 l-18,-18 l-8,-40 l36,-12 l20,6 z" transform="rotate(225)"/>
        <path d="M-120,0 l-18,-18 l-8,-40 l36,-12 l20,6 z" transform="rotate(270)"/>
        <path d="M-120,0 l-18,-18 l-8,-40 l36,-12 l20,6 z" transform="rotate(315)"/>
      </g>
    </g>

    <g transform="translate(0,80) rotate(-10)" filter="url(#emboss)">
      <g transform="translate(-70,0) rotate(-20)">
        <rect x="-8" y="-8" width="140" height="24" rx="6" fill="#686868" stroke="#2b2b2b" stroke-width="2"/>
        <rect x="88" y="-4" width="10" height="40" fill="#8b5a3c" rx="3"/>
      </g>
      <g transform="translate(70,0) rotate(20)">
        <path d="M-60,-10 h90 a12,12 0 0 1 12,12 v8 a12,12 0 0 1 -12,12 h-50 l-40,32 v-24 l40,-40 z" fill="#8d8d8d" stroke="#3b3b3b" stroke-width="3"/>
      </g>
    </g>

    <g transform="translate(0,180)">
      <path d="M-360,26 L-320,0 L-260,26 L-320,52 Z" fill="#2b2b2b" stroke="#111" stroke-width="4"/>
      <path d="M360,26 L320,0 L260,26 L320,52 Z" fill="#4b2b2b" stroke="#111" stroke-width="4" transform="scale(-1,1) translate(-720,0)"/>
      <rect x="-300" y="-6" width="600" height="64" rx="8" fill="#222" stroke="#0a0a0a" stroke-width="6"/>
      <rect x="-294" y="-0" width="588" height="52" rx="6" fill="#3a3a3a"/>
      <text x="0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#f2f2f2" text-anchor="middle" style="letter-spacing:3px">OpenSCAD Studio</text>
    </g>

    <text x="0" y="235" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#f0f0f0" text-anchor="middle">EST. 2026</text>
  </g>
</svg>
